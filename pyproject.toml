[project]
name = "friday-os"
version = "0.0.1"
description = "Voice-first, memory-persistent, MCP-powered personal AI OS."
requires-python = ">=3.12"
authors = [{ name = "Sahi", email = "sahiixofficial@gmail.com" }]
readme = "README.md"

dependencies = [
  "anthropic>=0.40",
  "pydantic>=2.6",
  "httpx>=0.27",
  "titans-memory @ git+https://github.com/sahiixx/sahiixx-titans-memory.git",
  "sahiixx-bus @ git+https://github.com/sahiixx/sahiixx-bus.git",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
memory = ["faiss-cpu>=1.8", "sentence-transformers>=3"]
a2a = ["fastapi>=0.115", "uvicorn>=0.30"]
voice = ["livekit-agents>=0.11", "livekit-plugins-openai>=0.11", "livekit-plugins-silero>=0.7"]
twilio = ["twilio>=9", "faster-whisper>=1", "edge-tts>=7", "starlette>=0.37", "uvicorn>=0.30", "httpx>=0.27"]
ollama = []  # No extra deps; stdlib-only provider via /api/chat.

[project.scripts]
friday = "friday.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["friday"]

[tool.ruff]
line-length = 100
target-version = "py310"
