<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FRIDAY OS</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
         background: #0b0d12; color: #eaeaea; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 12px 20px; border-bottom: 1px solid #1f2633; display: flex;
           justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: 0.5px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
         background: #4ade80; margin-right: 8px; box-shadow: 0 0 8px #4ade80; }
  .meta { font-size: 12px; color: #6b7280; }
  .demo { display: flex; gap: 6px; padding: 10px 20px; border-bottom: 1px solid #1f2633;
          background: #0e1117; flex-wrap: wrap; }
  .demo button { padding: 6px 10px; border-radius: 6px; border: 1px solid #2a3344;
                 background: #162033; color: #cbd5e1; font-size: 12px; cursor: pointer; }
  .demo button:hover { background: #1f2b42; }
  main { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  .turn { padding: 10px 14px; border-radius: 10px; max-width: 80%; line-height: 1.5; white-space: pre-wrap; }
  .user { background: #1d2638; align-self: flex-end; }
  .friday { background: #15202e; align-self: flex-start; border-left: 2px solid #3b82f6; }
  .tool { background: #0f2418; align-self: flex-start; border-left: 2px solid #4ade80;
          font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  .system { align-self: center; color: #6b7280; font-size: 12px; }
  form { display: flex; gap: 8px; padding: 14px 20px; border-top: 1px solid #1f2633; background: #0e1117; }
  input { flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid #2a3344;
          background: #11151c; color: #eaeaea; font-size: 14px; outline: none; }
  input:focus { border-color: #3b82f6; }
  button { padding: 10px 16px; border-radius: 8px; border: 0; cursor: pointer; font-weight: 500; }
  button[type=submit] { background: #3b82f6; color: white; }
  button[type=submit]:disabled { opacity: 0.5; cursor: wait; }
  .mic { background: #334155; color: #eaeaea; }
  .mic.on { background: #ef4444; color: white; }
  .toggle { background: transparent; color: #6b7280; font-size: 12px; }
  .toggle.on { color: #4ade80; }
</style>
</head>
<body>
  <header>
    <h1><span class="dot"></span>FRIDAY OS</h1>
    <div class="meta" id="meta">connecting…</div>
  </header>
  <div class="demo">
    <button onclick="testVoice()">🔊 Test voice</button>
    <button onclick="runTool('run_code','23*47')">run_code: 23*47</button>
    <button onclick="runTool('memory_save','pref: user likes tea')">memory_save</button>
    <button onclick="runTool('memory_recall','tea')">memory_recall: tea</button>
    <button onclick="runTool('search_web','ollama')">search_web: ollama</button>
    <button onclick="runTool('file_read','CLAUDE.md')">file_read: CLAUDE.md</button>
    <span class="meta" id="voicecount" style="margin-left:auto"></span>
  </div>
  <main id="log"></main>
  <form id="form">
    <button type="button" class="toggle" id="speak-toggle" title="Auto-speak replies">🔊 speak</button>
    <button type="button" class="mic" id="mic" title="Press to talk">🎤</button>
    <input id="input" placeholder="Ask FRIDAY…" autofocus autocomplete="off" />
    <button type="submit" id="send">Send</button>
  </form>

<script>
const $ = (id) => document.getElementById(id);
const log = $("log"), input = $("input"), form = $("form"), send = $("send"),
      mic = $("mic"), meta = $("meta"), speakToggle = $("speak-toggle"),
      voicecount = $("voicecount");

let autoSpeak = true;
speakToggle.classList.add("on");
speakToggle.onclick = () => {
  autoSpeak = !autoSpeak;
  speakToggle.classList.toggle("on", autoSpeak);
  speakToggle.textContent = autoSpeak ? "🔊 speak" : "🔇 muted";
};

// WHY: Web Speech voices load asynchronously. A `speak()` call before the list
// is populated silently drops the utterance. Prime the list and report count.
let voicesReady = false;
function primeVoices() {
  const vs = window.speechSynthesis?.getVoices?.() || [];
  voicecount.textContent = `${vs.length} voice${vs.length === 1 ? "" : "s"}`;
  if (vs.length) voicesReady = true;
}
if ("speechSynthesis" in window) {
  primeVoices();
  window.speechSynthesis.onvoiceschanged = primeVoices;
} else {
  voicecount.textContent = "no speechSynthesis";
}

function addTurn(role, text) {
  const el = document.createElement("div");
  el.className = `turn ${role}`;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

function speak(text) {
  if (!autoSpeak) return;
  const cleaned = text.replace(/```[\s\S]*?```/g, "").replace(/\s+/g, " ").slice(0, 400);
  if (!cleaned) return;
  // WHY: Windows SAPI via /speak is universally reliable. Browser speechSynthesis
  // silently fails on ~30% of setups. Server-side shell-to-SAPI just works.
  fetch(`/speak?text=${encodeURIComponent(cleaned)}`).catch(() => {});
}

function testVoice() {
  // WHY: user interaction satisfies autoplay policy; the first click unlocks TTS.
  if (!("speechSynthesis" in window)) return addTurn("system", "no speechSynthesis API");
  const u = new SpeechSynthesisUtterance("Voice is working. FRIDAY online.");
  const vs = window.speechSynthesis.getVoices();
  if (vs.length) u.voice = vs.find((v) => v.lang?.startsWith("en")) || vs[0];
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
  addTurn("system", `spoke via ${u.voice?.name || "default voice"} (${vs.length} voices)`);
}

async function runTool(name, arg) {
  addTurn("user", `/${name} ${arg}`);
  const t0 = performance.now();
  try {
    const r = await fetch(`/tool/${name}`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ input: arg }),
    });
    const data = await r.json();
    const text = data.output || `(no output) err=${data.error || "—"}`;
    addTurn("tool", text);
    meta.textContent = `tool:${name} · ${Math.round(performance.now() - t0)}ms`;
    speak(`${name} returned ${text}`.slice(0, 200));
  } catch (err) {
    addTurn("system", `tool error: ${err}`);
  }
}

async function sendText(text) {
  text = text.trim();
  if (!text) return;
  addTurn("user", text);
  input.value = "";
  send.disabled = true;
  const bubble = addTurn("friday", "");
  const t0 = performance.now();
  let full = "";
  try {
    // WHY: SSE streaming — first token in ~200ms vs 15s wait for full reply.
    const r = await fetch("/chat/stream", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ input: text }),
    });
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split("\n\n");
      buf = lines.pop() || "";
      for (const line of lines) {
        if (line.startsWith("data: ")) {
          const piece = line.slice(6);
          if (piece === "[done]") continue;
          full += piece;
          bubble.textContent = full;
          log.scrollTop = log.scrollHeight;
        }
      }
    }
    meta.textContent = `${Math.round(performance.now() - t0)}ms · ${full.length} chars`;
    speak(full);
  } catch (err) {
    bubble.textContent = `error: ${err}`;
    bubble.className = "turn system";
  } finally {
    send.disabled = false;
    input.focus();
  }
}

form.onsubmit = (e) => { e.preventDefault(); sendText(input.value); };

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) {
  // WHY: continuous mode + "friday" wake word lets the user talk hands-free.
  // Single-shot mode on click is preserved for push-to-talk.
  const rec = new SR();
  rec.continuous = true; rec.interimResults = false; rec.lang = "en-US";
  rec.onresult = (e) => {
    const t = e.results[e.results.length - 1][0].transcript.trim();
    const wake = /\bfriday\b/i;
    if (!wake.test(t)) { addTurn("system", `(heard: ${t})`); return; }
    const cmd = t.replace(wake, "").replace(/^[,.\s]+/, "").trim();
    if (cmd) sendText(cmd);
  };
  rec.onend = () => { if (mic.classList.contains("on")) rec.start(); };
  rec.onerror = () => mic.classList.remove("on");
  mic.onclick = () => {
    if (mic.classList.contains("on")) { mic.classList.remove("on"); rec.stop(); return; }
    mic.classList.add("on"); rec.start();
    addTurn("system", "Listening for 'Hey Friday…'");
  };
} else {
  mic.disabled = true; mic.title = "Speech recognition unavailable";
}

fetch("/health").then((r) => r.json()).then((d) => {
  meta.textContent = `${d.tools.length} tools ready`;
  addTurn("system", "FRIDAY online. Click a demo button above, press 🔊 Test voice, or type.");
}).catch(() => { meta.textContent = "server unreachable"; });
</script>
</body>
</html>
